# INUTILISÉ depuis la version 2.0 (2026-08-27) : l'application Android n'a plus de serveur.
# Conservé avec server/ et le Dockerfile comme base d'une éventuelle mise en ligne, non
# décidée (voir PROJET_CONTEXTE.md).

services:
  vault-watch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vault-watch
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - PORT=3001
    volumes:
      - ./server/data:/app/server/data
